<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura do MiniUtils</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --accent: #bf4520;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { max-width: 1360px; margin: 0 auto; padding: 32px 0; }
    header { padding: 0 clamp(16px, 4vw, 40px); }
    .eyebrow, .tag, .edge, .technical { font-family: var(--mono); }
    .eyebrow, .tag { font-size: 8px; font-weight: 500; letter-spacing: .14em; }
    .eyebrow { color: var(--muted); }
    h1 { font: 400 28px/1.15 var(--serif); margin: 8px 0; }
    header p:last-child { font-size: 14px; color: var(--muted); margin: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    svg text { fill: var(--ink); }
    .name { font: 600 12px var(--sans); }
    .tag, .edge { fill: var(--soft); }
    .edge { font-size: 8px; letter-spacing: .06em; text-anchor: middle; }
    .technical { font-size: 9px; fill: var(--muted); }
    .detail, .key { font: 400 11px var(--sans); fill: var(--muted); }
    .zone { fill: rgba(45,49,66,.02); stroke: #5a6580; stroke-dasharray: 4 4; }
    .core { fill: rgba(191,69,32,.08); stroke: var(--accent); stroke-width: 1.2; }
    .module { fill: #fff; stroke: var(--ink); }
    .outside { fill: rgba(45,49,66,.03); stroke: var(--soft); }
    .disk { fill: rgba(45,49,66,.05); stroke: var(--muted); }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">VISÃO DE ARQUITETURA · LINUX / WINDOWS</p>
      <h1>MiniUtils: arquitetura do hub</h1>
      <p>O hub compartilha a coleta de dados entre os mini-apps. Só os apps externos executam a própria lógica em outro processo.</p>
    </header>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Diagrama com rolagem horizontal">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="miniutils-architecture-title miniutils-architecture-desc">
        <title id="miniutils-architecture-title">Arquitetura do MiniUtils</title>
        <desc id="miniutils-architecture-desc">Dentro do processo Rust, o host coordena a interface Slint, os provedores sob demanda e o registro de mini-apps; fora dele ficam as fontes de dados, os arquivos locais e os apps externos que trocam JSON por entrada e saída padrão.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse"><polygon points="0,0 8,3 0,6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse"><polygon points="0,0 8,3 0,6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse"><polygon points="0,0 8,3 0,6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect class="zone" x="40" y="76" width="920" height="472" rx="8"/>
        <text class="tag" x="80" y="108">PROCESSO MINIUTILS · RUST</text>

        <!-- Runtime connections, behind the nodes. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="320" y1="360" x2="400" y2="360" marker-start="url(#arrow)"/>
          <line x1="520" y1="224" x2="520" y2="300" stroke-dasharray="5,4"/>
          <path d="M640,330 H672 Q680,330 680,322 V268 Q680,260 688,260 H720"/>
          <line x1="640" y1="360" x2="720" y2="360"/>
          <path d="M640,390 H672 Q680,390 680,398 V476 Q680,484 688,484 H720"/>
          <line x1="520" y1="420" x2="520" y2="564" marker-start="url(#arrow)"/>
        </g>
        <g fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)">
          <line x1="1000" y1="184" x2="640" y2="184"/>
          <line x1="920" y1="484" x2="1000" y2="484" marker-start="url(#arrow-link)"/>
        </g>
        <g fill="#f5f5f5">
          <rect x="328" y="340" width="64" height="12" rx="2"/>
          <rect x="528" y="256" width="56" height="12" rx="2"/>
          <rect x="788" y="164" width="64" height="12" rx="2"/>
          <rect x="928" y="464" width="64" height="12" rx="2"/>
        </g>
        <text class="edge" x="360" y="349">UI ↔ HOST</text>
        <text class="edge" x="556" y="265">EVENTOS</text>
        <text class="edge" x="820" y="173">LEITURAS</text>
        <text class="edge" x="960" y="473">JSONL</text>

        <g>
          <rect class="module" x="80" y="312" width="240" height="96" rx="6"/>
          <text class="tag" x="96" y="334">DESKTOP</text>
          <text class="name" x="96" y="358">Janela e bandeja</text>
          <text class="detail" x="96" y="376">Grade, configurações e loja</text>
          <text class="technical" x="96" y="392">Slint · integração nativa de bandeja</text>
        </g>
        <g>
          <rect x="400" y="300" width="240" height="120" rx="6" fill="#f5f5f5"/>
          <rect class="core" x="400" y="300" width="240" height="120" rx="6"/>
          <text class="tag" x="416" y="328">NÚCLEO</text>
          <text class="name" x="416" y="354">Host e registro de mini-apps</text>
          <text class="detail" x="416" y="374">Ativa apps e distribui eventos</text>
          <text class="detail" x="416" y="390">Oferece serviços aos mini-apps</text>
          <text class="technical" x="416" y="406">Hub · Host · Registry</text>
        </g>
        <g>
          <rect class="module" x="400" y="144" width="240" height="80" rx="6"/>
          <text class="tag" x="416" y="164">COLETA COMPARTILHADA</text>
          <text class="name" x="416" y="184">Provedores e barramento</text>
          <text class="detail" x="416" y="204">Coleta por tópico, só com assinantes</text>
        </g>
        <g>
          <rect class="module" x="720" y="220" width="200" height="80" rx="6"/>
          <text class="tag" x="736" y="240">COMPILADOS NO HUB</text>
          <text class="name" x="736" y="260">Mini-apps nativos</text>
          <text class="technical" x="736" y="280">Rust + Slint compilado</text>
        </g>
        <g>
          <rect class="module" x="720" y="320" width="200" height="80" rx="6"/>
          <text class="tag" x="736" y="340">EXTENSÕES NO PROCESSO</text>
          <text class="name" x="736" y="360">Plugins sem binário próprio</text>
          <text class="technical" x="736" y="380">[run] · [ui] com Slint / Rhai</text>
        </g>
        <g>
          <rect class="module" x="720" y="444" width="200" height="80" rx="6"/>
          <text class="tag" x="736" y="464">ADAPTADOR</text>
          <text class="name" x="736" y="484">Integração de apps externos</text>
          <text class="detail" x="736" y="504">Gerencia o processo e monta a tela</text>
        </g>
        <g>
          <rect class="outside" x="1000" y="144" width="240" height="80" rx="6"/>
          <text class="tag" x="1016" y="164">INTEGRAÇÕES</text>
          <text class="name" x="1016" y="184">Fontes de dados</text>
          <text class="detail" x="1016" y="204">Sistema, CLIs, arquivos e APIs</text>
        </g>
        <g>
          <rect class="outside" x="1000" y="444" width="240" height="80" rx="6"/>
          <text class="tag" x="1016" y="464">PROCESSO FILHO · [APP]</text>
          <text class="name" x="1016" y="484">Executável externo</text>
          <text class="technical" x="1016" y="504">stdin / stdout · permissões do usuário</text>
        </g>
        <g>
          <rect class="disk" x="400" y="564" width="240" height="80" rx="6"/>
          <text class="tag" x="416" y="584">PERSISTÊNCIA LOCAL</text>
          <text class="name" x="416" y="604">Configuração e dados dos apps</text>
          <text class="technical" x="416" y="624">config.toml · app-data/&lt;id&gt;/</text>
        </g>

        <g aria-hidden="true">
          <line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/>
          <text class="tag" x="40" y="685">LEGENDA</text>
          <rect x="120" y="673" width="24" height="14" rx="2" fill="none" stroke="#5a6580" stroke-dasharray="4 4"/>
          <text class="key" x="156" y="685">Limite do processo</text>
          <line x1="316" y1="680" x2="348" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text class="key" x="360" y="685">Chamadas e acesso a dados</text>
          <line x1="564" y1="680" x2="596" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text class="key" x="608" y="685">Eventos assíncronos</text>
          <line x1="796" y1="680" x2="828" y2="680" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <text class="key" x="840" y="685">Integração externa</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
