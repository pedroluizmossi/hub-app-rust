# Cyborg Neko animations. Format: top of src/mascot/clips.rs.
# Each frame has 14 rows of 16 characters, with the color roles of sprites.rs.

# Asleep: ears and top of the head drop 1 pixel and come back, as if breathing
# (eyes and base stay in place).
# An example to test the path end to end; replace it with a real drawing.
[sleep]
enter = "yawn"
fps = 1
frames = [
"""
.K............K.
KMK..........KMK
KMPK..KKKK..KPMK
KPPPKKPPPPKKPPPK
KPPPPPPPPPPPPPPK
KPHPPPPPPPPPPHPK
KCCCCCCCCCCCCCCK
KCEEWCCCCCCEEWCK
KCEEECCCCCCEEECK
KCCCCCCCCCCCCCCK
KPBBPPPPPPPPBBPK
KPPPPPPTTPPPPPPK
.KPPPPPPPPPPPPK.
..KKKKKKKKKKKK..
""",
"""
................
.K............K.
KMK..........KMK
KMPK..KKKK..KPMK
KPPPKKPPPPKKPPPK
KPHPPPPPPPPPPHPK
KCCCCCCCCCCCCCCK
KCEEWCCCCCCEEWCK
KCEEECCCCCCEEECK
KCCCCCCCCCCCCCCK
KPBBPPPPPPPPBBPK
KPPPPPPTTPPPPPPK
.KPPPPPPPPPPPPK.
..KKKKKKKKKKKK..
""",
]

# On falling asleep: the mouth widens, opens (rows 10 and 11, away from the chin) and closes;
