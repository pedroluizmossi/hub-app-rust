# Delivery: a `vX.Y.Z` tag builds the release version for Linux and Windows, packages it and
# publishes a GitHub Release with the files and their SHA-256 sums.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the `version` in Cargo.toml. A tag with a hyphen (`v0.2.0-rc1`) goes out as
# a pre-release. Tests do not run here but in CI (ci.yml) on every push to master: create
# the tag on a commit that passed it. Running it by hand (Actions tab › Release › Run workflow)
# only builds the packages, as run artifacts, without publishing anything: useful to test an
# `.exe`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest Ubuntu still supported: the binary runs on distros with an older glibc
          - os: ubuntu-22.04
            name: linux-x86_64
            binary: miniutils
          - os: windows-latest
            name: windows-x86_64
            binary: miniutils.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        run: |
          # `cargo pkgid` returns "…#miniutils@0.2.0" (or "…#0.2.0"): keep what comes after
          id=$(cargo pkgid -p miniutils --locked)
          version="${id##*[#@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # on a tag, it must be the version in Cargo.toml
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ matrix.name }}
          BINARY: ${{ matrix.binary }}
        run: |
          dir="miniutils-$VERSION-$NAME"
          mkdir -p "dist/$dir"
          cp "target/release/$BINARY" README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$dir/"
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="$dir.zip"
            7z a -tzip "$archive" "$dir" > /dev/null
          else
            archive="$dir.tar.gz"
            tar -czf "$archive" "$dir"
          fi
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: miniutils-${{ matrix.name }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish the Release
    needs: build
    # only on a tag; run by hand, the packages stay as artifacts
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          flags=(--generate-notes --verify-tag)
          # v0.2.0-rc1, v0.2.0-beta…: pre-release
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*
