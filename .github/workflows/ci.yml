# Integração contínua: compila e testa nos dois sistemas suportados. O app é nativo em
# Linux e Windows: uma mudança só entra se passar nos dois (ver "Plataformas" no AGENTS.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# um push novo no mesmo branch cancela a rodada anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # winit (X11/Wayland) e fontes: só o Linux precisa de pacotes do sistema
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      # `--locked`: falha se o Cargo.lock estiver desatualizado, em vez de resolver de novo
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      # aviso do clippy reprova: o código entra limpo nos dois sistemas
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
