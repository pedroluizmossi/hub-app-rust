# Continuous integration: builds and tests on both supported systems. The app is native on
# Linux and Windows: a change only goes in if it passes on both (see "Plataformas" in AGENTS.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# a new push to the same branch cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # winit (X11/Wayland) and fonts: only Linux needs system packages
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      # clippy type-checks every target (no separate `cargo check`); a warning fails the
      # build, so code goes in clean on both systems. `--locked`: fails if Cargo.lock is out
      # of date, instead of resolving again
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
