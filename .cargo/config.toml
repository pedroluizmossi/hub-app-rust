[env]
# sccache (when used as `rustc-wrapper`): strips the root of this tree from the cache key
# paths, so the main checkout and each worktree (.claude/worktrees/<name>) reuse each
# other's compiled dependencies. Without sccache it does nothing.
# `relative`: the value becomes the folder that contains this .cargo/, i.e. the root of
# each tree.
SCCACHE_BASEDIRS = { value = "", relative = true }
