[package]
name = "miniutils"
version = "0.1.0"
edition = "2024"
description = "Hub de mini-apps para o desktop Linux, com mascotes em pixel art e visuais trocáveis"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Só o renderizador por software: ~30 MB em uso, contra ~270 MB carregando o driver OpenGL
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
# janela popup: tirar da barra de tarefas (X11 / XWayland)
x11rb = "0.13"
raw-window-handle = "0.6"
# MPRIS (o que está tocando) pelo mesmo zbus que o ksni já traz; sem dependência nova
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
toml = "1.2.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
strip = true
