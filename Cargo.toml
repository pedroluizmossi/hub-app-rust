[package]
name = "miniutils"
version = "0.1.0"
edition = "2024"
description = "Hub de mini-apps para o desktop Linux, com mascotes em pixel art e visuais trocáveis"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { workspace = true }
# a interface (código gerado pelo Slint), num crate à parte: ver ui/Cargo.toml
miniutils-ui = { path = "ui" }
# janela popup: tirar da barra de tarefas (X11 / XWayland)
x11rb = "0.13"
raw-window-handle = "0.6"
# MPRIS (o que está tocando) pelo mesmo zbus que o ksni já traz; sem dependência nova
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
toml = "1.2.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
# prévia das animações em GIF (`miniutils --previa`); já vinha com as dependências do Slint
gif = "0.14"
# plugins com tela própria: o .slint do plugin é interpretado em tempo de execução e
# encaixado na janela (ComponentContainer). Mesma versão exata do slint.
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "internal"] }
# lógica dos plugins, isolada: sem módulos (não lê arquivo) e com limites de operação
rhai = { version = "1", features = ["no_module", "sync"] }
# assinatura do índice da loja (ed25519); já vinha com o HTTPS (rustls)
ring = "0.17"

[workspace]
members = ["ui", "tools/sprite-import"]

[workspace.dependencies]
# Só o renderizador por software: ~30 MB em uso, contra ~270 MB carregando o driver OpenGL
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "1.18.1"

# `cargo run` sem --release: o Slint (renderizador por software) e o desenho dos fundos e das
# mascotes, pixel a pixel, ficam lentos demais sem otimização. As dependências compilam
# otimizadas uma vez só (ficam em cache); o código do projeto, com otimização leve, ainda
# recompila rápido e mantém os símbolos de depuração.
[profile.dev]
opt-level = 1
# Só arquivo e linha (backtraces e panics continuam apontando o lugar): bem menos para
# gerar e linkar que o debuginfo completo. Para depurar com variáveis no gdb/lldb, troque
# por `debug = true` localmente.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
