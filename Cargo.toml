[package]
name = "miniutils"
version = "0.5.3"
edition = "2024"
description = "Desktop hub of mini-apps (Linux and Windows), with pixel-art mascots and swappable skins"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# logging to a file (see core/logging.rs); already pulled in by Slint
log = "0.4"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { workspace = true }
# the interface (code generated by Slint), in a separate crate: see ui/Cargo.toml
miniutils-ui = { path = "ui" }
# native window handle (X11 on Linux, HWND on Windows): see popup.rs
raw-window-handle = "0.6"
toml = "1.2.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
# hooks and limits: the plugins' database (apps/plugin/db.rs) refuses ATTACH and PRAGMA and limits time
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
chrono = "0.4"
# imported mascots (the user's PNGs, see mascot/pack.rs); the same version as sprite-import
png = "0.18"
# album covers of the CD Player (PNG/JPEG from the player), pixelated; already pulled in by Slint
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Mascots app: mascot packs downloaded as .zip (read only, deflate: what packs use)
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
# Mascots app: "choose a folder / .zip" dialog (the system's; on Linux through the XDG
# portal, with no GTK to build)
rfd = "0.18"
# Mascots app: edits sprite.toml and the mascot .toml keeping the person's comments and order
toml_edit = "0.25"
# plugins with their own view: the plugin's .slint is interpreted at run time and
# fitted into the window (ComponentContainer). Exactly the same version as slint.
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "internal"] }
# plugin logic, sandboxed: no modules (reads no files) and with operation limits
rhai = { version = "1", features = ["no_module", "sync"] }
# store index signature (ed25519); already pulled in by HTTPS (rustls)
ring = "0.17"
# system language for `language = "auto"` (core/i18n.rs); already pulled in by Slint
sys-locale = "0.3"
# Terminal app: the shell in a pseudo-terminal (Unix PTY, ConPTY on Windows) and the screen
# it draws (VT100/xterm escape sequences), shown in a window of our own
portable-pty = "0.9"
vt100 = "0.18"

# Linux only: tray (StatusNotifierItem), X11 and D-Bus. None of this builds on Windows; the
# code using them lives in `linux.rs` modules (see "Plataformas" in AGENTS.md).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
# popup window: keep it off the taskbar (X11 / XWayland)
x11rb = "0.13"
# MPRIS (what is playing) through the same zbus that ksni already brings; no new dependency
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Windows only: the equivalent of each one above, in `windows.rs` modules.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
# CPU, memory, disks, network and processes (on Linux this comes straight from /proc and /sys)
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
# Win32 (single-instance pipe, processes, shell, window, monitor work area) and WinRT (what is playing)
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = ["ui", "tools/sprite-import", "examples/app-hello"]

[workspace.dependencies]
# Only the software renderer: ~30 MB in use, against ~270 MB loading the OpenGL driver
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "1.18.1"

# `cargo run` without --release: Slint (software renderer) and the pixel-by-pixel drawing of
# backdrops and mascots are far too slow without optimization. Dependencies are built
# optimized only once (they stay cached); the project's code, lightly optimized, still
# recompiles fast and keeps the debug symbols.
[profile.dev]
opt-level = 1
# Only file and line (backtraces and panics still point to the place): much less to
# generate and link than full debuginfo. To debug with variables in gdb/lldb, switch to
# `debug = true` locally.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# The interface generated by Slint (ui/hub.rs, ~10 MB of Rust) without optimization: changing a .slint
# recompiles in ~11 s, against ~43 s with `opt-level = 1`. Drawing (Slint's renderer,
# backdrops and mascots) stays optimized: it lives in the dependencies and the app crate.
[profile.dev.package.miniutils-ui]
opt-level = 0

# Development-only features (none goes into the normal build or the release):
# `dev-mcp` turns on Slint's built-in MCP server (with `SLINT_MCP_PORT=<port>`): an agent
# sees the window, takes screenshots and clicks. `live-preview` reloads the .slint files on
# save, without recompiling. See AGENTS.md › "Interface (Slint)" and tools/dev-ui.sh.
[features]
dev-mcp = ["miniutils-ui/dev-mcp"]
live-preview = ["miniutils-ui/live-preview"]

[profile.release]
lto = "thin"
strip = true
