# MiniUtils example window skin. The key is the file name ("ocean").
# Copy it to <data>/miniutils/skins/ and click Settings › Appearance › Reload.
label = "Ocean"
base = "noite"           # starts from Rainy night and changes only what follows
app_theme = "ocean"      # app theme under "Follows the window" (themes/ocean.toml)
backdrop = "bubbles"     # backdrop: neon, terminal, papel, cidade or one from backdrops/

bg = "#03121f"
panel = "#062033"
edge = "#1d4a66"
line = "#123a52"
surface = "#072638"
surface_edge = "#1d4a66"
field = "#03121f"
field_edge = "#1d4a66"
slot = "#1d4a66"
ink = "#e6f7ff"
sub = "#a9cfe3"
dim = "#7fa8bf"
panel_ink = "#e6f7ff"
panel_sub = "#a9cfe3"
tag_ink = "#ff9f7f"
accent = "#7fdbff"
accent_ink = "#03121f"
accent2 = "#ff7f50"
hover = "#0b3350"

card_alpha = 0.9         # cards slightly see-through over the backdrop
title = "plain"
font_title = "Pixelify Sans"
