# Example external app: an executable of its own (src/main.rs), with full access.
# Format: top of src/core/plugins.rs; protocol: top of src/apps/external.rs.
# Texts (name, description, labels) are in English; i18n/pt-BR.po translates them.
id = "io.github.pedroluizmossi.app-hello"
name = "Hello, external app"
description = "Example external app: reads the home folder, keeps a counter in a file and shows the CPU. Works on Linux and Windows."
icon = "robo"
api = 1
# the provider's reading reaches the app as {"type":"event","topic":"sys",...}
uses = ["sys"]

[app]
view = "view.slint"
linux = "bin/app-hello"
windows = "bin/app-hello.exe"
every = 5

[[settings]]
key = "show_home"
label = "Show the home folder"
type = "bool"
default = true
