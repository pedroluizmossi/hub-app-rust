# Example plugin with its own view and script: the heaviest processes right now.
# Format: top of src/core/plugins.rs and src/apps/plugin/mod.rs in the MiniUtils repository.
# Texts (name, description) are in English; i18n/pt-BR.po translates them.
id = "io.github.pedroluizmossi.top-processes"
name = "Top processes"
description = "The processes using the most CPU or memory, with its own view and script. Works on Linux and Windows. Example plugin from the MiniUtils store."
icon = "robo"
api = 1
# the process list arrives in fn on_event("procs", data); runs nothing
uses = ["procs"]

[ui]
view = "view.slint"
script = "main.rhai"
