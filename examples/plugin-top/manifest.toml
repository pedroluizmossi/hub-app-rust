# Plugin de exemplo com tela e script próprios: os processos mais pesados do momento.
# Formato: topo de src/core/plugins.rs e src/apps/plugin.rs no repositório do MiniUtils.
id = "io.github.exemplo.top"
name = "Top processos"
description = "Os processos que mais usam CPU ou memória (ps), com tela e script próprios. Plugin de exemplo da loja."
icon = "robo"
api = 1

[permissions]
exec = ["ps"]

[ui]
view = "view.slint"
script = "main.rhai"
every = 5
