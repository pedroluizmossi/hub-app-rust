# MiniUtils example plugin: shows how long the computer has been on.
# Format: top of src/core/plugins.rs in the MiniUtils repository.
# Texts (name, description, title) are in English; i18n/pt-BR.po translates them.
id = "io.github.exemplo.uptime"
name = "Uptime"
description = "How long the computer has been on (uptime -p). Example plugin from the store."
icon = "coruja"
api = 1

[permissions]
exec = ["uptime"]

[run]
command = ["uptime", "-p"]
every = 30

[display]
title = "Up for"
lines = 2

# the owl is happy after a day on, and tired after a week
# (the words are matched against the output of uptime -p, which is in English)
[[mood]]
contains = "week"
mood = "busy"

[[mood]]
contains = "day"
mood = "happy"
