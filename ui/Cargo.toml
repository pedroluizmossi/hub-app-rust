[package]
name = "miniutils-ui"
version = "0.1.0"
edition = "2024"
description = "MiniUtils Slint interface (ui/hub.slint and the mini-app screens), compiled separately"
license = "MIT"
publish = false

# Interface-only crate: the code Slint generates (tens of thousands of lines) stays cached
# here, so changing only the app's Rust does not recompile it.
[lib]
path = "src/lib.rs"

[dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

# Development only; enabled by the root crate's features of the same name (see Cargo.toml).
[features]
# Slint MCP server; build.rs also records element ids so it can find them
dev-mcp = ["slint/mcp"]
# the generated code interprets the .slint files and reloads them on save (see build.rs)
live-preview = ["slint/live-preview"]
