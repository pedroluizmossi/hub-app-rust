id = "cyber.docker"
name = "Docker"
description = "Containers and stacks with quick actions; the mascot reacts when something goes down."
icon = "neko"
api = 1
uses = ["docker"]

[permissions]
exec = ["docker"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "hide_stopped"
label = "Hide stopped containers"
type = "bool"
default = false

[[settings]]
key = "sort"
label = "Sort list by"
type = "choice"
default = "estado"
options = ["estado", "nome", "cpu", "ram"]

[[settings]]
key = "notify"
label = "Notify when a container goes down"
type = "bool"
default = true

[[settings]]
key = "notify_recovery"
label = "Notify when it comes back"
type = "bool"
default = false

[[settings]]
key = "busy_cpu"
label = "Restless mascot when a container's CPU is above (%)"
type = "int"
default = 60
min = 10
max = 100
step = 10

[[settings]]
key = "mascot"
label = "Mascot"
type = "choice"
default = "neko"
options = ["neko", "polvo", "pato", "coruja", "robo", "kitsune", "usagi", "yurei", "hacker"]
