id = "cyber.agents"
name = "AI agents"
description = "Claude Code, Codex and OpenCode sessions: who is working, who is waiting for you and who is done."
icon = "robo"
api = 1
uses = ["agents"]

[permissions]
# only to resume an idle session in a terminal (`codex resume <id>`, `opencode -s <id>`)
exec = ["codex", "opencode"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "recent"
label = "Show sessions idle for up to (min)"
type = "int"
default = 60
min = 5
max = 720
step = 5

[[settings]]
key = "notify_waiting"
label = "Notify when an agent is waiting for you"
type = "bool"
default = false

[[settings]]
key = "notify_done"
label = "Notify when an agent finishes"
type = "bool"
default = false

[[settings]]
key = "heroes"
label = "Subagents walk as the imported mascots (a different one for each new subagent)"
type = "bool"
default = true

[[settings]]
key = "mascot"
label = "Mascot"
type = "choice"
default = "robo"
options = ["robo", "coruja", "polvo", "neko", "hacker", "kitsune", "rato", "morcego"]
