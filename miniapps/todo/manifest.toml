id = "cyber.todo"
name = "Quick to-do"
description = "A short task list, saved on the computer; the mascot celebrates when it is empty."
icon = "capivara"
api = 1

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "hide_done"
label = "Hide done tasks"
type = "bool"
default = false

[[settings]]
key = "done_last"
label = "Move done tasks to the end of the list"
type = "bool"
default = true

[[settings]]
key = "mascot"
label = "Mascot"
type = "choice"
default = "capivara"
options = ["capivara", "coruja", "neko", "sapo", "coelho", "chaleira", "cogumelo", "gatopao", "pato"]

# the list lives in todo.json, in the app data folder (core/appdata.rs)
[data]
kinds = ["files"]
