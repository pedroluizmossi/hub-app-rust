# Falas das mascotes dos Sinais vitais ({s} = "CPU", "RAM", "GPU", "DISCO"). Formato:
# src/core/chatter.rs. O que não estiver aqui vem das falas genéricas (src/hub/lines.toml).

[strain]
pt = ["ufa, {s} em {v}%... quem tá me esquentando? :o", "{s} em {v}%! alguém tá trabalhando muito aí?", "{s} em {v}%... tô suando aqui :3"]
en = ["phew, {s} at {v}%... who's heating me up? :o", "{s} at {v}%! is someone working hard?"]
de = ["puh, {s} bei {v}%... wer heizt hier? :o"]

[idle]
pt = ["contando ciclos... 1, 2, 3... zzz", "{s} fresquinha, vida boa :3", "tudo verdinho por aqui ^_^"]
en = ["counting cycles... 1, 2, 3... zzz", "all green over here ^_^"]
de = ["alles grün hier ^_^"]

[reply.idle]
pt = ["aqui também tá tranquilo, {a} ^_^", "shh... tô medindo a temperatura (o.o)"]
en = ["all calm here too, {a} ^_^", "shh... i'm taking the temperature (o.o)"]
