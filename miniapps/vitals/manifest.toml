id = "cyber.vitals"
name = "Vital signs"
description = "CPU, RAM, GPU, disk and network, each with a mascot that follows the load."
icon = "chip"
api = 1
uses = ["sys", "gpu"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "warn"
label = "Mascot gets restless from (%)"
type = "int"
default = 60
min = 10
max = 95
step = 5

[[settings]]
key = "alarm"
label = "Mascot in alarm from (%)"
type = "int"
default = 90
min = 20
max = 100
step = 5

[[settings]]
key = "alerts"
label = "Warn when something stays high for a while"
type = "bool"
default = true

[[settings]]
key = "show_temps"
label = "Show temperatures"
type = "bool"
default = true

[[settings]]
key = "temp_hot"
label = "Hot temperature (°C)"
type = "int"
default = 80
min = 50
max = 100
step = 5

[[settings]]
key = "temp_critical"
label = "Critical temperature (°C)"
type = "int"
default = 95
min = 60
max = 110
step = 5

[[settings]]
key = "cpu_mascot"
label = "CPU mascot"
type = "choice"
default = "abelha"
options = ["abelha", "chip", "robo", "neko", "kitsune", "polvo", "hacker", "sapo"]

[[settings]]
key = "ram_mascot"
label = "RAM mascot"
type = "choice"
default = "slime"
options = ["slime", "sapo", "neko", "robo", "kitsune", "fantasma", "chip"]

[[settings]]
key = "gpu_mascot"
label = "GPU mascot"
type = "choice"
default = "auto"
options = ["auto", "nvidia", "amd", "robo", "neko", "chip", "vagalume"]

[[settings]]
key = "disk_mascot"
label = "Disk mascot"
type = "choice"
default = "tartaruga"
options = ["tartaruga", "disquete", "caracol", "robo", "neko", "yurei", "chip"]

[[settings]]
key = "net_mascot"
label = "Network mascot"
type = "choice"
default = "rato"
options = ["rato", "caracol", "usagi", "kitsune", "coruja", "neko", "robo"]
