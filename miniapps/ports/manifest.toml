id = "cyber.ports"
name = "Open ports"
description = "What is listening on each port, with shortcuts to open it in the browser and to kill the process."
icon = "coruja"
api = 1
uses = ["ports"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "show_udp"
label = "Show UDP"
type = "bool"
default = false

[[settings]]
key = "hide_others"
label = "Hide other users' ports (no process)"
type = "bool"
default = false

[[settings]]
key = "notify_new"
label = "Notify when a new port opens"
type = "bool"
default = false

[[settings]]
key = "warn_exposed"
label = "Restless mascot when one of your ports is open to the network"
type = "bool"
default = false

[[settings]]
key = "mascot"
label = "Mascot"
type = "choice"
default = "coruja"
options = ["coruja", "rato", "polvo", "neko", "robo", "hacker", "kitsune", "morcego"]
