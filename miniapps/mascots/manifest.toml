id = "cyber.mascots"
name = "Mascots"
description = "Your mascots in one place: import a folder or a .zip, rename, choose animations and colors, and put them to use."
icon = "slime"
api = 1

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "mascot"
label = "Mascot"
type = "choice"
default = "slime"
options = ["slime", "kitsune", "polvo", "capivara", "neko", "coruja"]
