# genéricas (src/hub/lines.toml).

[trouble]
pt = [
    "ai... gastei {v}% do meu limite (T_T)",
    "acho que falei demais hoje... {v}%!",
    "ai ai, meu limite tá acabando (T_T)",
    "{v}%?! porra, eu avisei que ia acabar! >:(",
]
en = [
    "oops... i used {v}% of my limit (T_T)",
    "i talked too much today... {v}%!",
    "uh oh, my limit is running out (T_T)",
    "{v}%?! damn it, i told you it would run out! >:(",
]
de = ["oje... {v}% von meinem Limit (T_T)"]

[trouble.answer]
pt = ["pega leve com o {a}, hein! ^^'", "{a}, bebe uma água e descansa <3"]
en = ["go easy on {a}, okay? ^^'", "{a}, drink some water and rest <3"]
