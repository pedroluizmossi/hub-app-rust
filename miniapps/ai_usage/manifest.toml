id = "cyber.ai_usage"
name = "AI subscriptions"
description = "Limits and credits of Codex, Claude, Kiro and OpenCode Go."
icon = "robo"
api = 1
uses = ["ai_usage"]

[permissions]
exec = ["codex", "claude", "kiro-cli", "opencode"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "warn"
label = "Bar and mascot get restless from (%)"
type = "int"
default = 75
min = 10
max = 95
step = 5

[[settings]]
key = "alarm"
label = "Bar and mascot in alarm from (%)"
type = "int"
default = 90
min = 20
max = 100
step = 5

[[settings]]
key = "alerts"
label = "Warn when a limit goes past the alarm"
type = "bool"
default = true

[[settings]]
key = "forecast"
label = "Predict when the limit runs out (from the usage pace)"
type = "bool"
default = true

[[settings]]
key = "show_codex"
label = "Show Codex"
type = "bool"
default = true

[[settings]]
key = "show_claude"
label = "Show Claude"
type = "bool"
default = true

[[settings]]
key = "show_kiro"
label = "Show Kiro"
type = "bool"
default = true

[[settings]]
key = "show_opencode"
label = "Show OpenCode Go"
type = "bool"
default = true

[[settings]]
key = "hide_empty"
label = "Hide sources with no reading"
type = "bool"
default = false

[[settings]]
key = "reset_relative"
label = "Show the reset as time left (instead of a date)"
type = "bool"
default = false

[[settings]]
key = "compact"
label = "Compact mode (no status or reset)"
type = "bool"
default = false

[[settings]]
key = "poll"
label = "Refresh every (min)"
type = "int"
default = 3
min = 1
max = 30
step = 1
