id = "cyber.cd"
name = "CD Player"
description = "What is playing: spinning disc, track and player controls."
icon = "cd"
api = 1
uses = ["media"]

[[settings]]
key = "theme"
label = "Theme"
type = "choice"
default = "auto"
# options: "auto" and every theme, filled in by the hub (SettingDef::live_options)

[[settings]]
key = "notify_track"
label = "Notify when the track changes"
type = "bool"
default = false

[[settings]]
key = "tray_controls"
label = "Show music and controls in the tray menu"
type = "bool"
default = false

[[settings]]
key = "seek"
label = "Skip forward/back step (s)"
type = "int"
default = 10
min = 5
max = 60
step = 5
